<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game Server 管理</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e8eef6;background:#101923;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:60px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin-bottom:8px}p{color:#a9b8c8;line-height:1.6}section{background:#192632;border:1px solid #324455;border-radius:14px;padding:28px;margin-top:26px}#login{max-width:440px;margin:50px auto}label{display:block;margin:16px 0 8px;color:#c9d6e3}input{width:100%;padding:12px;border:1px solid #4a5c6f;border-radius:7px;background:#101923;font:inherit}button{padding:11px 18px;border:0;border-radius:7px;background:#70c6ae;color:#10231e;font:inherit;cursor:pointer}button.secondary{background:#304457;color:#e8eef6}button.danger{background:#512d37;color:#ffbdc8}button:disabled{opacity:.5;cursor:wait}form button{margin-top:20px}.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:16px 10px;border-bottom:1px solid #324455}th{color:#a9b8c8;font-size:13px}td button{padding:7px 12px;margin-right:8px}code{color:#a9d8ff}#message{min-height:24px;margin-top:20px;color:#e7b776}#empty{padding:30px 0;text-align:center}.hidden,[hidden]{display:none!important}@media(max-width:650px){main{margin-top:24px}.grid{grid-template-columns:1fr}section{padding:20px}header{align-items:start}}
</style></head>
<body><main><header><div><h1>Game Server 管理</h1><p>配置游戏版本及其服务器地址</p></div><div id="account" hidden><span id="username"></span> <button class="secondary" id="logout">退出登录</button></div></header>
<section id="login"><h2>管理员登录</h2><form id="loginForm"><label for="user">账户</label><input id="user" autocomplete="username" required maxlength="64"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form></section>
<div id="dashboard" hidden><section><h2 id="formTitle">添加版本</h2><p>先启动 Game Server，再填写网关可访问的服务地址。保存后立即生效。</p><form id="routeForm"><div class="grid"><div><label for="version">Game Version</label><input id="version" placeholder="例如 1.0" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,63}"></div><div><label for="serverUrl">Game Server URL</label><input id="serverUrl" placeholder="http://game-1.0:8081" type="url" required maxlength="512"></div></div><label class="check"><input id="enabled" type="checkbox" checked>启用此版本</label><button type="submit">保存配置</button> <button id="reset" type="button" class="secondary">新建版本</button></form></section>
<section><header><h2>版本配置</h2><button id="refresh" class="secondary">刷新</button></header><p>未配置或停用的版本无法通过网关访问游戏服务。</p><div class="table-wrap"><table id="routeTable" hidden><thead><tr><th>版本号</th><th>服务器地址</th><th>状态</th><th>操作</th></tr></thead><tbody id="routes"></tbody></table></div><p id="empty">还没有版本配置，添加第一个版本后即可接入。</p></section></div><div id="message" role="status" aria-live="polite"></div></main>
<script>
let csrf=''; const $=id=>document.getElementById(id); let routes=[];
function message(text){$('message').textContent=text;}
function loggedIn(session){csrf=session.csrf;$('username').textContent=session.username;$('account').hidden=false;$('login').hidden=true;$('dashboard').hidden=false;$('password').value='';}
function loggedOut(){csrf='';routes=[];$('routes').replaceChildren();$('account').hidden=true;$('dashboard').hidden=true;$('login').hidden=false;}
async function api(path,options={}){const response=await fetch('/admin/api/'+path,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers}});if(!response.ok){if(response.status===401)loggedOut();const text=await response.text();throw new Error(text.trim()||'请求失败');}return response.status===204?null:response.json();}
function reset(){ $('version').readOnly=false;$('routeForm').reset();$('enabled').checked=true;$('formTitle').textContent='添加版本'; }
function render(){const body=$('routes');body.replaceChildren();$('routeTable').hidden=routes.length===0;$('empty').hidden=routes.length!==0;for(const route of routes){const row=document.createElement('tr');for(const value of [route.version,route.server_url,route.enabled?'已启用':'已停用']){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}const actions=document.createElement('td');const edit=document.createElement('button');edit.className='secondary';edit.textContent='编辑';edit.onclick=()=>{$('version').value=route.version;$('version').readOnly=true;$('serverUrl').value=route.server_url;$('enabled').checked=route.enabled;$('formTitle').textContent='编辑版本 '+route.version;$('serverUrl').focus();};const remove=document.createElement('button');remove.className='danger';remove.textContent='删除';remove.onclick=async()=>{if(!confirm('删除版本 '+route.version+' 的路由？该版本将无法连接游戏服务器。'))return;remove.disabled=true;try{await api('routes/'+encodeURIComponent(route.version),{method:'DELETE'});await refresh();reset();message('版本配置已删除。');}catch(error){message(error.message);}finally{remove.disabled=false;}};actions.append(edit,remove);row.append(actions);body.append(row);}}
async function refresh(){routes=await api('routes');render();}
$('loginForm').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{const session=await api('login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('password').value})});loggedIn(session);await refresh();message('');}catch(error){message(error.message);}finally{button.disabled=false;}};
$('routeForm').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('routes',{method:'PUT',body:JSON.stringify({version:$('version').value,server_url:$('serverUrl').value,enabled:$('enabled').checked})});await refresh();reset();message('配置已保存，网关立即生效。');}catch(error){message(error.message);}finally{button.disabled=false;}};
$('logout').onclick=async()=>{try{await api('logout',{method:'POST'});loggedOut();reset();message('已退出登录。');}catch(error){message(error.message);}};
$('refresh').onclick=()=>refresh().then(()=>message('')).catch(error=>message(error.message));$('reset').onclick=reset;
(async()=>{try{loggedIn(await api('session'));await refresh();}catch(error){if(csrf)message(error.message);}})();
</script></body></html>
